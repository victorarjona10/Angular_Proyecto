server {
  listen       80;
  server_name  _;

  root   /usr/share/nginx/html;
  index  index.html;

  # Sirve index.html directamente sin reescrituras
  location = /index.html {
    # Nada especial, deja que nginx sirva el fichero
  }

  # Rutas de la SPA
  location / {
    # Primero intenta ficheros físicos o directorios,
    # y si no existen, entrega index.html SIN volver a caer en /index.html
    try_files $uri $uri/ /index.html =404;
  }

  # Opcional: compresión gzip
  gzip              on;
  gzip_http_version 1.1;
  gzip_disable      "MSIE [1-6]\.";
  gzip_min_length   256;
  gzip_vary         on;
  gzip_proxied      expired no-cache no-store private auth;
  gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_comp_level   6;
}
